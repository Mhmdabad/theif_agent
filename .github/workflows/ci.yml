name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Official uv installer; matches the .python-version pin (3.12).
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install workspace (uv sync)
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      # Coverage threshold is config-driven: the ≥85% gate lives in
      # [tool.coverage.report].fail_under in pyproject.toml (task 0.9), so this
      # step carries no hard-coded number that could diverge from config.
      - name: Tests + coverage (pytest, fail under 85%)
        run: uv run pytest --cov --cov-report=term-missing

      # Budget from CONTRIBUTING.md; pre-existing offenders are grandfathered
      # in the script's manifest and may shrink but not grow.
      - name: 150-line file check
        run: uv run python scripts/check_line_limit.py

      # The two agents duplicate their shared logic on purpose — sharing a
      # live-state module disqualifies the solution — so nothing but this step
      # keeps the copies in lockstep. A shared change therefore lands in the
      # sibling first; this side stays red until it does, which is the point.
      - name: Shared-module drift vs Mhmdabad/police_agent
        run: uv run python scripts/check_shared_drift.py

      # Task 0.11 wires the real secret scan; until then this skips.
      - name: Secret scan
        run: |
          if [ -f scripts/secret_scan.py ]; then
            uv run python scripts/secret_scan.py
          else
            echo "secret scan pending task 0.11 (scanner absent)"
          fi
