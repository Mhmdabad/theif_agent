# Two peers playing each other over real HTTP, in two containers.
#
#     docker compose -f sparring/docker-compose.yml up --abort-on-container-exit
#
# This is the demo and a CI job at once. Two separate processes is also what the book requires of
# a real submission (App. E rules 1-2: the cop's and the thief's code run in completely separate
# processes, no shared memory) — so the topology here is the one you will actually ship, not a
# convenience.
#
# To practise against THIS peer with your own implementation, use docker-compose.await.yml
# instead: it stands up one peer and waits for you to dial it.
#
# On Linux, create the artifacts directory before you start, or the daemon creates it root-owned
# and the peers — which run as a non-root user on purpose — cannot write into it:
#
#     mkdir -p sparring/runs && chmod 777 sparring/runs

services:
  spar-a:
    build:
      context: ..
      dockerfile: sparring/Dockerfile
    command:
      - serve
      - --host=0.0.0.0
      - --port=8931
      - --role=police
      - --group-id=sparring-a
      - --peer=http://spar-b:8932/mcp
      # Each peer gets its OWN artifacts directory. Both derive the same game_id — that is the
      # point of sorting it — so a shared directory means both processes writing identical
      # filenames at the same time, and a reader can catch a file mid-write. Two real teams are
      # never on one filesystem; this mirrors that rather than pretending otherwise.
      - --artifacts=/kit/runs/spar-a
    ports:
      - "8931:8931"
    volumes:
      - ./runs:/kit/runs

  spar-b:
    build:
      context: ..
      dockerfile: sparring/Dockerfile
    command:
      - serve
      - --host=0.0.0.0
      - --port=8932
      - --role=thief
      - --group-id=sparring-b
      - --peer=http://spar-a:8931/mcp
      - --artifacts=/kit/runs/spar-b
    ports:
      - "8932:8932"
    volumes:
      - ./runs:/kit/runs
