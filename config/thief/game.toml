# ---------------------------------------------------------------------------
# PRIVATE per-peer configuration — THIEF.
#
# Nothing here is negotiated and nothing here needs to match the opponent.
# The decision test (Appendix B): "must the opponent agree to this value, or
# rely on it?" If yes it belongs in the SHARED config/game.json; if no it
# stays here.
#
# When config/game.json exists its values OVERRIDE any matching key in this
# file, so a private file can never weaken a signed match condition.
#
# This file is committed. It must never contain a secret — no API keys, no
# OAuth material. Those live outside the repo and are gitignored.
# ---------------------------------------------------------------------------

version = "1.10"

[game]
group_name = "s82kma9e"
group_id   = "s82kma9e"                # 8 characters, no spaces
members = ["Mohammed Abad", "Muhammad Swalha"]        # EDIT: add every team member
repos = { cop = "https://github.com/Mhmdabad/police_agent", thief = "https://github.com/Mhmdabad/theif_agent" }

[network]
my_port      = 8802                          # THIS agent's MCP server port
opponent_url = "http://127.0.0.1:8801/mcp"   # the only thing we know about the opponent
turn_timeout_seconds = 180

# LEAGUE PLAY: leave the loopback address above alone and export the opponent's
# tunnel URL instead. OPPONENT_URL overrides this file (see ClientSettings.
# from_config), so checking out this repo and running the two agents against
# each other keeps working with no setup, and a real match is one variable:
#
#     export OPPONENT_URL=https://their-subdomain.ngrok-free.app
#
# It is not committed for two reasons. It is ephemeral - a free-tier tunnel
# issues a new URL on every restart - and it is not ours; a repository full of
# other teams' expired addresses is a record of nothing. Our own public address
# is exported the same way, as PUBLIC_URL; see docs/TUNNELING.md.

# [strategy] -- point at OUR brain subclass. The move policy is the core of
# the grade; see docs/prd/PRD-3-blind-strategy.md.
#
# SearchingThief runs an alpha-beta search of the cop's replies across the
# likeliest cells the cop may occupy, instead of ranking the five candidates
# one ply deep. Measured against the shipped heuristic over 25 openings: it
# survived 25/25 where ThiefBrain survived 17/25 against a searching cop, at
# ~41 ms a move against a 30 s deadline. Comment this out to fall back.
[strategy]
thief_class = "thief_agent.strategy.thief_search:SearchingThief"
police_class = "thief_agent.strategy.police_search:SearchingPolice"  # even sub-games: roles alternate

# [trash_talk] -- optional: HOW the banter is produced. The MOVE is always
# pure Python; the language model never touches the spatial decision.
#
# Uncomment to switch providers. claude_api reads ANTHROPIC_API_KEY from the
# environment -- never put a key in this file, which is committed (Appendix C
# makes a leaked key a submission gate). Spend is charged from the usage the
# API reports and counted against the Appendix F series budget; when the budget
# runs out the provider drops to template for the rest of the series.
[trash_talk]
provider = "auto"         # auto (key in .env ? claude_api : template) | template | ollama | claude_api | claude_cli
model = "claude-haiku-4-5"  # the rulebook asks for a small cloud model
every_n_steps = 3         # a call every Nth turn; 1 exceeds the series budget

[llm]
model = "template"                 # zero-token default; see Appendix F table 21
step_deadline_seconds = 30         # hard cap on thinking per step

[email]
# recipient: not here. The destination is REPORT_RECIPIENT in .env — one source,
# so no copy of it can go stale against another. See .env.example.
mode = "send"                                     # armed: a real match mails the lecturer

# --- WHO IS PLAYING -------------------------------------------------------
# FR-7.28 wants four repository links in the result: our cop, our thief, their
# cop, their thief. Ours are in [game] above. Theirs go here, and nothing can
# derive them — swap these with the other team before the match, along with
# their group name and members.
#
# THE THREE LINES BELOW ARE PLACEHOLDERS AND MUST BE REPLACED BEFORE A MATCH.
# They are deliberately not another team's real details: a repository carrying
# last opponent's id is a file nobody edits, because it already looks filled in.
# These do not, so a match played against the wrong name is a mistake somebody
# had to make rather than one they could inherit.
#
# Our own identity is fixed in [game] above and never changes; only this block
# does, once per opponent. OPPONENT_GROUP_ID is the 8-character id they give you
# in the negotiation, and it must match what their greeting announces on the
# wire — the series standing is keyed by the exchanged ids, not by these names.
[teams.them]
group_name = "moamteam"                             # EDIT per opponent
members = ["Mohammad Yosef", "Amear Abu Farekh"]  # EDIT per opponent
repos = { cop = "https://github.com/J0kErF/moamteam-police", thief = "https://github.com/J0kErF/moamteam-thief" }  # theirs, not ours
